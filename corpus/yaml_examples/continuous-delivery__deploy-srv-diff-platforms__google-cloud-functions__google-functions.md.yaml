# source: docs/continuous-delivery/deploy-srv-diff-platforms/google-cloud-functions/google-functions.md  (https://developer.harness.io/docs/continuous-delivery/deploy-srv-diff-platforms/google-cloud-functions/google-functions)

# --- example 1 ---
function:
  name: my-function
  runtime: python37
  entryPoint: my_function
  httpsTrigger:
    securityLevel: SECURE_OPTIONAL

# --- example 2 ---
# The following are the minimum set of parameters required to create a Google Cloud Function.
# If you use a remove manifest, please ensure it includes all of these parameters.

function:
  name: <functionName>
  build_config:
    runtime: nodejs18
    entry_point: helloGET
  environment: GEN_2
function_id: <functionName>

# --- example 3 ---
function:
  name: my-http-function
  build_config:
    runtime: nodejs14
    entry_point: myFunction
  environment: GEN_2
function_id: my-http-function

# --- example 4 ---
function:
  name: my-env-function
  build_config:
    runtime: python38
    entry_point: my_function
    environment_variables:
      MY_VAR: my-value
  environment: GEN_2
function_id: my-env-function

# --- example 5 ---
function:
  name: my-storage-function
  build_config:
    runtime: go111
    entry_point: MyFunction
  service_config:
    available_memory: 512
    timeout: 180s
  environment: GEN_2
  event_trigger:
    trigger: projects/_/buckets/my-bucket
    event_type: google.storage.object.finalize    
function_id: my-storage-function

# --- example 6 ---
function:
  name: canaryDemo-<+env.name>
  service_config:
    environment_variables:
      MY_ENV_VAR: "True"
      GCF_FF_KEY: "<+env.variables.GCF_FF_KEY>"
  build_config:
    runtime: python39
    entry_point: hello_world
  environment: GEN_2
function_id: canaryDemo-<+env.name>

# --- example 7 ---
# The following are the minimum set of parameters required to create a Google Cloud Function.
# If you use a remove manifest, please ensure it includes all of these parameters.

function:
  name: "my-secret-env-func"
  description: "Using Secret Environment Variables"
  region: "us-east1"
  runtime: "nodejs16"
  build_config:
    entry_point: myFunction
  max_instances: 1
  event_trigger:
    event_type: "providers/cloud.pubsub/eventTypes/topic.publish"
    trigger: "projects/<project>/topics/<topic>"
  service_config:
    environment_variables:
      MY_ENV_VAR1: value1
      MY_ENV_VAR2: value2
    secret_environment_variables:
      [
        {
          key: "MY_SECERT_ENV_VAR1",
          project_id: <project_id>,
          secret: "<secretName1>",
          version: "<secretVersion1>",
        },
        {
          key: "MY_SECERT_ENV_VAR2",
          project_id: <project_id>,
          secret: "<secretName2>",
          version: "<secretVersion2>",
        },
      ]

# --- example 8 ---
service:
  name: helloworld
  identifier: Google_Function
  serviceDefinition:
    type: GoogleCloudFunctions
    spec:
      manifests:
        - manifest:
            identifier: GoogleFunction
            type: GoogleCloudFunctionDefinition
            spec:
              store:
                type: Harness
                spec:
                  files:
                    - /GoogleFunctionDefinition.yaml
      artifacts:
        primary:
          primaryArtifactRef: <+input>
          sources:
            - spec:
                connectorRef: gcp_connector
                project: cd-play
                bucket: cloud-functions-automation-bucket
                artifactPath: helloworld
              identifier: helloworld
              type: GoogleCloudStorage

# --- example 9 ---
infrastructureDefinition:
  name: dev
  identifier: dev
  description: "dev google cloud infrastructure"
  tags: {}
  orgIdentifier: default
  projectIdentifier: serverlesstest
  environmentRef: dev
  deploymentType: GoogleCloudFunctions
  type: GoogleCloudFunctions
  spec:
    connectorRef: gcp_connector
    project: cd-play
    region: us-central1
  allowSimultaneousDeployments: false

# --- example 10 ---
execution:
  steps:
    - step:
        name: Deploy Cloud Function
        identifier: deployCloudFunction
        type: DeployCloudFunction
        timeout: 10m
        spec: {}

# --- example 11 ---
execution:
  steps:
    - stepGroup:
        name: Canary Deployment
        identifier: canaryDepoyment
        steps:
          - step:
              name: Deploy Cloud Function With No Traffic
              identifier: deployCloudFunctionWithNoTraffic
              type: DeployCloudFunctionWithNoTraffic
              timeout: 10m
              spec: {}
          - step:
              name: Cloud Function Traffic Shift
              identifier: cloudFunctionTrafficShiftFirst
              type: CloudFunctionTrafficShift
              timeout: 10m
              spec:
                trafficPercent: 10
          - step:
              name: Cloud Function Traffic Shift
              identifier: cloudFunctionTrafficShiftSecond
              type: CloudFunctionTrafficShift
              timeout: 10m
              spec:
                trafficPercent: 100

# --- example 12 ---
execution:
  steps:
    - stepGroup:
        name: Blue Green Deployment
        identifier: blueGreenDepoyment
        steps:
          - step:
              name: Deploy Cloud Function With No Traffic
              identifier: deployCloudFunctionWithNoTraffic
              type: DeployCloudFunctionWithNoTraffic
              timeout: 10m
              spec: {}
          - step:
              name: Cloud Function Traffic Shift
              identifier: cloudFunctionTrafficShift
              type: CloudFunctionTrafficShift
              timeout: 10m
              spec:
                trafficPercent: 100
