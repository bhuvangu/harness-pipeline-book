# source: docs/continuous-integration/use-ci/run-tests/ci-fastapi-test.md  (https://developer.harness.io/docs/continuous-integration/use-ci/run-tests/ci-fastapi-test)

# --- example 1 ---
- step:
    type: Run
    name: Install Dependencies
    identifier: Install_Dependencies
    spec:
      shell: Sh
      command: |-
        sudo apt-get update && sudo apt-get install -y python3-dev && sudo apt-get install default-libmysqlclient-dev
        pip install --cache-dir .pip_cache -r requirements.txt
      envVariables:
        PIP_CACHE_DIR: /root/.cache

# --- example 2 ---
- step:
    type: Run
    name: Install Dependencies
    identifier: Install_Dependencies
    spec:
      connectorRef: YOUR_IMAGE_REGISTRY_CONNECTOR
      image: python:latest
      shell: Sh
      command: |-
        sudo apt-get update && sudo apt-get install -y python3-dev && sudo apt-get install default-libmysqlclient-dev
        pip install --cache-dir .pip_cache -r requirements.txt

# --- example 3 ---
- step:
    type: Run
    name: Pytest
    identifier: Pytest
    spec:
      shell: Sh
      command: |-
        pytest test_main.py --junit-xml=output-test.xml
      reports:
        type: JUnit
        spec:
          paths:
            - output-test.xml

# --- example 4 ---
- step:
    type: Run
    name: Pytest
    identifier: Pytest
    spec:
      connectorRef: YOUR_IMAGE_REGISTRY_CONNECTOR
      image: python:latest
      shell: Sh
      command: |-
        pytest test_main.py --junit-xml=output-test.xml
      reports:
