# --- example 2 ---
service:
  name: k8s_service
  identifier: k8s_service
  orgIdentifier: default
  projectIdentifier: Krishika_CD_Samples
  serviceDefinition:
    spec:
      artifacts:
        primary:
          sources:
            - identifier: demo_artifact
              type: Har
              spec:
                registryRef: dev
                type: docker
                spec:
                  imagePath: function-plugin
                  tag: <+input>
                  digest: ""
          primaryArtifactRef: demo_artifact
    type: Kubernetes

