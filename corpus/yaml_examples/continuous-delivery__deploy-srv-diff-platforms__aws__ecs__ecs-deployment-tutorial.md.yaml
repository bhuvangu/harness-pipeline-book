# --- example 5 ---
AWSTemplateFormatVersion: "2010-09-09"
Description: CloudFormation template for provisioning ECS resources

Parameters:
  ClusterName:
    Type: String
    Description: Name of the ECS cluster

Resources:
  ECSCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Ref ClusterName

Outputs:
  region_name:
    Value: !Ref AWS::Region
    Description: AWS region where the ECS cluster is deployed

  cluster_name:
    Value: !Ref ECSCluster
    Description: Name of the provisioned ECS cluster

# --- example 6 ---
resourceId: service/<ECS cluster name>/<ECS service name>
serviceNamespace: ecs
scalableDimension: ecs:service:DesiredCount
minCapacity: 1
maxCapacity: 3

# --- example 7 ---
scalableDimension: ecs:service:DesiredCount
serviceNamespace: ecs
policyName: P1
policyType: TargetTrackingScaling
targetTrackingScalingPolicyConfiguration:
  targetValue: 60
  predefinedMetricSpecification:
    predefinedMetricType: ECSServiceAverageCPUUtilization
  scaleOutCooldown: 300
  scaleInCooldown: 300

# --- example 8 ---
scheduledActionName: scale_up
serviceNamespace: ecs
schedule: "cron(30 6 * * ? *)"
scalableDimension: "ecs:service:DesiredCount"
scalableTargetAction:
  minCapacity: 3
  maxCapacity: 10

# --- example 9 ---
scheduledActionName: scale_down
serviceNamespace: ecs
schedule: "cron(30 12 * * ? *)"
scalableDimension: "ecs:service:DesiredCount"
scalableTargetAction:
  minCapacity: 1
  maxCapacity: 1

# --- example 10 ---
scheduledActionName: scale_up_afternoon_ist
serviceNamespace: ecs
schedule: "cron(0 14 * * ? *)"
timezone: "Asia/Kolkata"
scalableDimension: "ecs:service:DesiredCount"
scalableTargetAction:
  minCapacity: 3
  maxCapacity: 10

# --- example 11 ---
service:
  name: ecs_service_rolling
  identifier: ecs_service_rolling
  serviceDefinition:
    type: ECS
    spec:
      manifests:
        - manifest:
            identifier: task_def
            type: EcsTaskDefinition
            spec:
              store:
                type: Github
                spec:
                  connectorRef: <github_connector>
                  gitFetchType: Branch
                  paths:
                    - ECS/sample/RegisterTaskDefinitionRequest.yaml
                  repoName: <your_repo>
                  branch: master
        - manifest:
            identifier: service_def
            type: EcsServiceDefinition
            spec:
              store:
                type: Github
                spec:
                  connectorRef: <github_connector>
                  gitFetchType: Branch
                  paths:
                    - ECS/sample/CreateServiceRequest.yaml
                  repoName: <your_repo>
                  branch: master
        - manifest:
            identifier: scaling_policy
            type: EcsScalingPolicyDefinition
            spec:
              store:
                type: Github
                spec:
                  connectorRef: <github_connector>
                  gitFetchType: Branch
                  paths:
                    - ECS/sample/PutScalingPolicyRequest.yaml
                  repoName: <your_repo>
                  branch: master
        - manifest:
            identifier: scalable_target
            type: EcsScalableTargetDefinition
            spec:
              store:
                type: Github
                spec:
                  connectorRef: <github_connector>
                  gitFetchType: Branch
                  paths:
                    - ECS/sample/RegisterScalableTargetRequest.yaml
                  repoName: <your_repo>
                  branch: master
        - manifest:
            identifier: scheduled_action
            type: EcsScheduledActionDefinition
            spec:
              store:
                type: Harness
                spec:
                  files:
                    - /scheduled_action
        - manifest:
            identifier: scale_down
            type: EcsScheduledActionDefinition
            spec:
              store:
                type: Harness
                spec:
                  files:
                    - /scale_down.yaml
      artifacts:
        primary:
          primaryArtifactRef: <+input>
          sources:
            - spec:
                connectorRef: <ecr_connector>
                imagePath: <image_path>
                tag: latest
                region: us-east-1
              identifier: ecr_artifact
              type: Ecr

# --- example 12 ---
- step:
    type: EcsRollingDeploy
    name: ECS Rolling Deploy
    identifier: ecsRollingDeploy
    timeout: 10m
    spec:
      skipApplicationScaling: true

