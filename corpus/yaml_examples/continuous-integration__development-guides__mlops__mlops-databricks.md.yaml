# source: docs/continuous-integration/development-guides/mlops/mlops-databricks.md  (https://developer.harness.io/docs/continuous-integration/development-guides/mlops/mlops-databricks)

# --- example 1 ---
              - step:
                  type: Plugin
                  name: databricks
                  identifier: databricks_plugin
                  spec:
                    connectorRef: YOUR_IMAGE_REGISTRY_CONNECTOR
                    image: harnesscommunity/databricks-ml
                    settings:
                      host: https://abc-1234-def.cloud.databricks.com/
                      pat: <+secrets.getValue("databricks_token")>
                      job_name: new job
                      NOTEBOOK_PATH: /Workspace/Shared/sample_notebook
                      TASK_KEY: mydemotask
                      Description: test desc
                      CLUSTER_ID: <+secrets.getValue("databricks_clusterId")>
                    imagePullPolicy: Always
