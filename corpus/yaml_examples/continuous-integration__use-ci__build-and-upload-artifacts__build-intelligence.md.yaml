# source: docs/continuous-integration/use-ci/build-and-upload-artifacts/build-intelligence.md  (https://developer.harness.io/docs/continuous-integration/use-ci/build-and-upload-artifacts/build-intelligence)

# --- example 1 ---
- stage:
    name: build
    identifier: build
    type: CI
    spec:
      buildIntelligence:
        enabled: true
        connectorRef: aws_connector
        region: us-east-1
        bucket_name: my-build-cache-bucket
      cloneCodebase: true

# --- example 2 ---
- stage:
    name: build
    identifier: build
    type: CI
    spec:
      buildIntelligence:
        enabled: true
        runAsUser: 0
      cloneCodebase: true

# --- example 3 ---
- stage:
    name: build
    identifier: build
    type: CI
    spec:
      buildIntelligence:
        enabled: true
        resources:
          requests:
            memory: 512Mi
            cpu: 400m
          limits:
            memory: 2Gi
            cpu: 1000m
      cloneCodebase: true

# --- example 4 ---
- stage:
    name: build
    identifier: build
    type: CI
    spec:
      buildIntelligence:
        enabled: true
        connectorRef: my_connector
        region: us-east-1
        bucket_name: my-build-cache-bucket
        runAsUser: 0
        resources:
          requests:
            memory: 512Mi
            cpu: 400m
          limits:
            memory: 2Gi
            cpu: 1000m
      cloneCodebase: true
      infrastructure:
        type: KubernetesDirect
        spec:
          connectorRef: k8
          namespace: harness-delegate-ng
          os: Linux
