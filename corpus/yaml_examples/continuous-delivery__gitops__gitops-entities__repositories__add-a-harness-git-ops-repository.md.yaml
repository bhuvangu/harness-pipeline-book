# source: docs/continuous-delivery/gitops/gitops-entities/repositories/add-a-harness-git-ops-repository.md  (https://developer.harness.io/docs/continuous-delivery/gitops/gitops-entities/repositories/add-a-harness-git-ops-repository)

# --- example 1 ---
   apiVersion: v1  
   kind: Secret  
   metadata:  
      name: private-repo  
      namespace: cd  
      labels:  
         argocd.argoproj.io/secret-type: repository  
      stringData:  
         type: git  
         url: https://github.com/argoproj/private-repo  
         proxy: https://proxy-server-url:8888  
         password: my-password  
         username: my-username
