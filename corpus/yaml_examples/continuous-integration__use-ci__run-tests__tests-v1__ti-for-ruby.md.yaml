# source: docs/continuous-integration/use-ci/run-tests/tests-v1/ti-for-ruby.md  (https://developer.harness.io/docs/continuous-integration/use-ci/run-tests/tests-v1/ti-for-ruby)

# --- example 1 ---
- step:
    type: RunTests
    name: Run Ruby Tests
    identifier: Run_Ruby_Tests
    spec:
      language: Ruby
      buildTool: Rspec
      runOnlySelectedTests: true ## Must be 'true' to enable TI.

# --- example 2 ---
- stage:
    strategy:
      parallelism: 2
    name: test
    identifier: test
    type: CI
    spec:
      cloneCodebase: true
      platform:
        os: Linux
        arch: Amd64
      runtime:
        type: Cloud
        spec: {}
      execution:
        steps:
          - step:
              type: Run
              name: Dependencies
              identifier: dependencies
              spec:
                shell: Sh
                command: |-
                  apt-get update -y
                  apt -y install libarchive-tools
          - step:
              type: RunTests
              name: Run Tests
              identifier: run_tests
              spec:
                language: Ruby
                buildTool: Rspec
                testGlobs: "test/unit/**/*_test.rb" ## Optional
                runOnlySelectedTests: true ## Must be 'true' to use TI.
                enableTestSplitting: true ## Optional. Apply parallelism to further improve test times.

# --- example 3 ---
pipeline:
  projectIdentifier: default
  orgIdentifier: default
  identifier: testintelligencedemo
  name: Test Intelligence Demo
  properties:
    ci:
      codebase:
        connectorRef: YOUR_CODEBASE_CONNECTOR_ID
        repoName: YOUR_CODE_REPO_NAME
        build: <+input>
  tags: {}
  stages:
    - stage:
        name: Ruby tests
        identifier: rubytests
        type: CI
        spec:
          cloneCodebase: true
          execution:
            steps:
              - step:
                  type: Run Ruby Tests
                  name: Run_Ruby_Tests
                  identifier: Run_Ruby_Tests
                  spec:
                    connectorRef: YOUR_IMAGE_REGISTRY_CONNECTOR
                    image: ruby:latest ## Specify if required by your build infrastructure.
                    language: Ruby
                    buildTool: Rspec
                    runOnlySelectedTests: true ## Must be 'true' to use TI.
          infrastructure:
            type: KubernetesDirect
            spec:
              connectorRef: YOUR_KUBERNETES_CLUSTER_CONNECTOR_ID
              namespace: YOUR_KUBERNETES_NAMESPACE
              automountServiceAccountToken: true
              nodeSelector: {}
              os: Linux

# --- example 4 ---
reports:
  type: JUnit
  spec:
    paths:
      - tmp/junit.xml
