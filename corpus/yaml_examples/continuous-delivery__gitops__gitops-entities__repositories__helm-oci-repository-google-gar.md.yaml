# source: docs/continuous-delivery/gitops/gitops-entities/repositories/helm-oci-repository-google-gar.md  (https://developer.harness.io/docs/continuous-delivery/gitops/gitops-entities/repositories/helm-oci-repository-google-gar)

# --- example 1 ---
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: gcp-secret-store
spec:
  provider:
    gcpsm:
      projectID: <YOUR_GCP_PROJECT_ID>
      auth:
        secretRef:
          secretAccessKeySecretRef:
            name: gcp-sa-secret
            key: secret-access-credentials
            namespace: <AGENT_NAMESPACE>

# --- example 2 ---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: REPO_SECRET_NAME
  namespace: AGENT_NAMESPACE
spec:
  refreshInterval: "55m"
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: REPO_SECRET_NAME
    creationPolicy: Merge
    template:
      data:
        password: TEMPLATE_EXPRESSION
  data:
    - secretKey: access_token
      remoteRef:
        key: SECRET_NAME_IN_GSM
