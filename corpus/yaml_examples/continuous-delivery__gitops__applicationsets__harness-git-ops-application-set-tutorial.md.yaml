# source: docs/continuous-delivery/gitops/applicationsets/harness-git-ops-application-set-tutorial.md  (https://developer.harness.io/docs/continuous-delivery/gitops/applicationsets/harness-git-ops-application-set-tutorial)

# --- example 1 ---
generators:
  - list:
      elements:
        - ns: engineering-dev
          url: https://kubernetes.default.svc
        - ns: engineering-prod
          url: https://kubernetes.default.svc
        - ns: engineering-check1
          url: https://kubernetes.default.svc

# --- example 2 ---
template:
  metadata:
    name: "{{.ns}}-guestbook"
    labels:
      harness.io/serviceRef: guestbook
      harness.io/envRef: dev
    annotations:
      argocd.argoproj.io/sync-options: CreateNamespace=true
  spec:
    project: default
    source:
      repoURL: https://github.com/argoproj/argo-cd.git
      path: applicationset/examples/list-generator/guestbook/{{.ns}}
      targetRevision: HEAD
    destination:
      server: https://kubernetes.default.svc
      namespace: "{{.ns}}"
    syncPolicy:
      automated:
        prune: true
        selfHeal: true
      syncOptions:
        - CreateNamespace=true

# --- example 3 ---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: dev-microservices
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error

  generators:
  - list:
      elements:
        - domain: corporate-banking
          service: compliance-service
          namespace: corporate-banking
          serviceRef: cbcomplianceservice
          envRef: Dev_GitOps_Product_Demo
        - domain: corporate-banking
          service: corp-banking-api
          namespace: corporate-banking
          serviceRef: cbcorpbankapi
          envRef: Dev_GitOps_Product_Demo
        - domain: corporate-banking
          service: treasury-service
          namespace: corporate-banking
          serviceRef: cbtreasuryservice
          envRef: Dev_GitOps_Product_Demo
        - domain: retail-banking
          service: account-service
          namespace: retail-banking
          serviceRef: rbaccountservice
          envRef: Dev_GitOps_Product_Demo
        - domain: retail-banking
          service: transaction-service
          namespace: retail-banking
          serviceRef: rbtransactionservice
          envRef: Dev_GitOps_Product_Demo
        - domain: loans
          service: loans-api
          namespace: loans
          serviceRef: loansapi
          envRef: Dev_GitOps_Product_Demo

  template:
    metadata:
      name: "dev-{{.service}}"
      labels:
        environment: "dev"
        app: "{{.service}}"
        harness.io/serviceRef: "{{.serviceRef}}"
        harness.io/envRef: "{{.envRef}}"
    spec:
      project: banking

      source:
        repoURL: https://github.com/example-org/gitops-demo
        targetRevision: main
        path: "services/{{.domain}}/{{.service}}/overlays/dev"

      destination:
        server: "https://kubernetes.default.svc"
        namespace: "{{.namespace}}"

      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true

# --- example 4 ---
    apiVersion: argoproj.io/v1alpha1  
    kind: ApplicationSet  
    metadata:  
      name: guestbook  
    spec:  
      generators:  
        - git:  
            repoURL: https://github.com/<YOUR_ACCOUNT_NAME>/applicationset.git  
            revision: HEAD  
            files:  
            - path: "examples/git-generator-files-discovery/cluster-config/**/config.json"  
      template:  
        metadata:  
          name: '{{cluster.name}}-guestbook'
          labels: 
            harness.io/envRef: '{{envTag}}'
            harness.io/serviceRef: '{{serviceTag}}'
            harness.io/buildRef: '{{releaseTag}}'
        spec:  
          project: <PROJECT_ID_IN_AGENT_PAGE>  
          source:  
            repoURL: https://github.com/<YOUR_ACCOUNT_NAME>/applicationset.git  
            targetRevision: HEAD  
            path: "examples/git-generator-files-discovery/apps/guestbook"  
          destination:  
            server: '{{cluster.address}}'  
            namespace: default  
          syncPolicy:  
            automated: {}

