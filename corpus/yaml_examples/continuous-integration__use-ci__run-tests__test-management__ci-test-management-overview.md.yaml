# source: docs/continuous-integration/use-ci/run-tests/test-management/ci-test-management-overview.md  (https://developer.harness.io/docs/continuous-integration/use-ci/run-tests/test-management/ci-test-management-overview)

# --- example 1 ---
- run:
    script: |-
      pytest --junitxml=test-results.xml -v
      hcli test-reports upload test-results.xml

# --- example 2 ---
- step:
    type: Run
    name: Run Tests
    spec:
      shell: Sh
      command: |
        ./gradlew clean test
        hcli test-reports upload "build/test-results/test/*.xml"

# --- example 3 ---
- run:
    script: |-
      go install github.com/jstemmer/go-junit-report/v2@latest
      go test -v ./... 2>&1 | go-junit-report > report.xml
      hcli test-reports upload report.xml
