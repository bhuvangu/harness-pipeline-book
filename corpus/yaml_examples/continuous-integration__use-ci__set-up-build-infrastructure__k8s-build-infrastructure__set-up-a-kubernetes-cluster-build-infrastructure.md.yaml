# source: docs/continuous-integration/use-ci/set-up-build-infrastructure/k8s-build-infrastructure/set-up-a-kubernetes-cluster-build-infrastructure.md  (https://developer.harness.io/docs/continuous-integration/use-ci/set-up-build-infrastructure/k8s-build-infrastructure/set-up-a-kubernetes-cluster-build-infrastructure)

# --- example 1 ---
apiVersion: v1
kind: Service
metadata:
  name: headless
spec:
  clusterIP: None
  selector:
    accountID: HARNESS_ACCOUNT_ID
  ports:
    - protocol: TCP
      port: 20001
      targetPort: 20001

# --- example 2 ---
stages:
  - stage:
      name: build
      identifier: build
      description: ""
      type: CI
      spec:
        cloneCodebase: true
        infrastructure:
          type: KubernetesDirect ## Specifies the infrastructure type as Kubernetes.
          spec:
            connectorRef: YOUR_K8S_CLUSTER_CONNECTOR_ID
            namespace: YOUR_K8S_NAMESPACE
            automountServiceAccountToken: true ## This is the default value for this setting. Harness automatically includes this setting if you don't include it.
            nodeSelector: {} ## This is empty by default. Harness automatically includes this setting if you don't include it.
            os: Linux ## Set the OS as 'Linux' or 'Windows'.
            ## Include additional advanced settings if required.

# --- example 3 ---
spec:
  connectorRef: YOUR_K8S_CLUSTER_CONNECTOR_ID
  namespace: YOUR_K8S_CLUSTER_NAMESPACE
  volumes:
    - mountPath: /tmp/pgdata1
      type: EmptyDir
      spec:
        medium: ""
    - mountPath: /tmp/pgdata2
      type: EmptyDir
      spec:
        medium: ""

# --- example 4 ---
tolerations:
  - effect: NoSchedule
    key: key1
    operator: Equal
    value: value1
  - effect: NoSchedule
    key: key2
    operator: Equal
    value: value2

# --- example 5 ---
tolerations:
  - identifier: identifier1
    effect: NoSchedule
    key: key1
    operator: Equal
    value: value1
  - identifier: identifier2
    effect: NoSchedule
    key: key1
    operator: Equal
    value: value2

# --- example 6 ---
podSpecOverlay: |-
  topologySpreadConstraints:
    - maxSkew: 3
      minDomains: 2
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: DoNotSchedule
      labelSelector:
        matchExpressions:
          - key: app
            operator: In
            values:
              - my-app
              - anotherapp
          - key: tier
            operator: NotIn
            values:
              - frontend
              - backend
              - full-stack
