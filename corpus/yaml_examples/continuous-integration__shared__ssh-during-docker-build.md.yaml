# source: docs/continuous-integration/shared/ssh-during-docker-build.md  (https://developer.harness.io/docs/continuous-integration/shared/ssh-during-docker-build)

# --- example 1 ---
pipeline:
  projectIdentifier: YOUR_PROJECT_ID
  orgIdentifier: YOUR_ORG_ID
  tags: {}
  stages:
    - stage:
        name: Build
        identifier: Build
        type: CI
        spec:
          cloneCodebase: false
          execution:
            steps:
              - step:
                  type: Run
                  name: Create Dockerfile
                  identifier: Run
                  spec:
                    connectorRef: account.harnessImage
                    image: alpine
                    shell: Sh
                    command: |-
                      mkdir docker

                      cat > Dockerfile <<- "EOF"
                      FROM node:20-slim AS base
                      RUN apt-get update && apt-get install git -y
                      RUN mkdir -p ~/.ssh && ssh-keyscan github.com >> ~/.ssh/known_hosts
                      RUN --mount=type=ssh,id=sshkey git clone git@github.com:GITHUB_ORG/PRIVATE_REPO.git
                      RUN ls -lR PRIVATE_REPO
                      EOF

                      cat Dockerfile
                      mv Dockerfile docker/

                      ls -al /harness
                      # docker pull harness/buildkit:1.0.1
              - step:
                  type: Run
                  name: SSH Key Prep
                  identifier: SSH_Key_Prep
                  spec:
                    shell: Sh
                    command: |-
                      cat << EOF > /harness/id_ed25519
                      <+secrets.getValue("SSH_KEY")> # SSH_KEY is a file secret containing the private SSH key
                      EOF
                      chmod 400 /harness/id_ed25519
              - step:
                  type: BuildAndPushDockerRegistry
                  name: Build and Push Image
                  identifier: Build_and_Push_Image
                  spec:
                    connectorRef: DOCKER_CONNECTOR
                    repo: DOCKER_ORG/DOCKER_REPO
                    tags:
                      - multiarch
                    caching: true # Required to enable BuildKit/buildx; without this, buildx will not be used
                    dockerfile: docker/Dockerfile
                    resources:
                      limits:
                        memory: 1Gi
                        cpu: 750m
                    envVariables:
                      PLUGIN_BUILDX_OPTIONS: "--ssh=sshkey=/harness/id_ed25519"
                  when:
                    stageStatus: Success
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
        when:
          pipelineStatus: Success
        description: ""
  identifier: SSH_Dockerfile_Example
  name: SSH Dockerfile Example
