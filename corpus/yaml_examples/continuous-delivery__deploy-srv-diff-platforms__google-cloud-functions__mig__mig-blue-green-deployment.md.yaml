# --- example 5 ---
- step:
    identifier: traffic_shift_with_headers
    type: GoogleMigTrafficShift
    name: Traffic Shift with Header Routing
    spec:
      trafficConfig:
        type: CSM
        spec:
          type: GRPCRoute
          route: projects/PROJECT_ID/locations/global/grpcRoutes/ROUTE_NAME
          destinations:
            - destination: stage
              weight: 100
            - destination: stable
              weight: 0
          headerRoutingAdd:
            - key: X-Test-Stage
              value: "true"
              matchType: exact
              destination: stage
            - key: X-QA-Version
              value: <+pipeline.variables.versionTag>
              matchType: regex
              destination: stage
      connectorRef: account.harnessImage
      image: harness/google-mig-traffic-shift:0.1.0-linux-amd64
      imagePullPolicy: Always
      resources:
        limits:
          memory: 512Mi
          cpu: 0.5

