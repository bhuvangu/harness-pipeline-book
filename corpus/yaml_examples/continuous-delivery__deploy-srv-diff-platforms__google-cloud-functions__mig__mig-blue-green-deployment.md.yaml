    name: Traffic Shift - 10%
    type: GoogleMigTrafficShift
    spec:
                  destinations:
        - environment: stable
          weight: 90
        - environment: stage
          weight: 10

        - step:
    name: Approval - Validate 10%
    type: HarnessApproval
