# source: docs/continuous-integration/shared/output-var.md  (https://developer.harness.io/docs/continuous-integration/shared/output-var)

# --- example 1 ---
              - step:
                  type: Run
                  name: alpha
                  identifier: alpha
                  spec:
                    shell: Sh
                    command: export myVar=varValue
                    outputVariables:
                      - name: myVar
              - step:
                  type: Run
                  name: beta
                  identifier: beta
                  spec:
                    shell: Sh
                    command: |-
                      echo <+steps.alpha.output.outputVariables.myVar>
                      echo <+execution.steps.alpha.output.outputVariables.myVar>

# --- example 2 ---
              - step:
                  type: Run
                  name: alpha
