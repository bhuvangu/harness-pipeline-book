# --- example 10 ---
trigger:
  name: scheduled build
  identifier: scheduled_build
  enabled: true
  orgIdentifier: default
  projectIdentifier: JenkinsCI
  pipelineIdentifier: Demo
  source:
    type: Scheduled
    spec:
      type: Cron
      spec:
        expression: 45 13 * * 2
  inputYaml: |
    pipeline:
      identifier: Demo
      properties:
        ci:
          codebase:
            build:
              type: branch
              spec:
                branch: main

