            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          execution:
            steps:
              - step:
                  type: Run
                  name: maven-build
                  identifier: maven_build
                  spec:
                    connectorRef: myDockerHubConnector
                    image: maven:3.8.1-jdk-11
                    shell: Bash
                    command: mvn clean install
