# --- example 1 ---
template:
  name: step_template_1
  identifier: step_template_1
  versionLabel: v1
  type: Step
  projectIdentifier: Pipeline_Samples
  orgIdentifier: default1
  tags: {}
  spec:
    timeout: 10m
    type: ShellScript
    spec:
      shell: Bash
      executionTarget: {}
      delegateSelectors: []
      source:
        type: Inline
        spec:
          script: echo hello
      environmentVariables:
        - name: var1
          type: String
          value: val1
      outputVariables: []

