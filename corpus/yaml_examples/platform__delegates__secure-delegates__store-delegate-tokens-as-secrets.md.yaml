# source: docs/platform/delegates/secure-delegates/store-delegate-tokens-as-secrets.md  (https://developer.harness.io/docs/platform/delegates/secure-delegates/store-delegate-tokens-as-secrets)

# --- example 1 ---
   apiVersion: v1
   kind: Secret
     metadata:
     name: token-secret
     namespace: harness-delegate-ng
     type: Opaque
   stringData:
   DELEGATE_TOKEN: <Delegate-token-value>

# --- example 2 ---
   - name: DELEGATE_TOKEN
     valueFrom:
       secretKeyRef:
         name: token-secret
         key: DELEGATE_TOKEN
