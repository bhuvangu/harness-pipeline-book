# source: docs/continuous-integration/use-ci/run-tests/test-report-ref.md  (https://developer.harness.io/docs/continuous-integration/use-ci/run-tests/test-report-ref)

# --- example 1 ---
- step:
    type: Run
    identifier: test
    name: Test
    spec:
      shell: Sh
      command: |-
        mkdir build
        cmake -S . -B build
        ctest --test-dir build --output-junit out.xml
      reports:
        type: JUnit
        spec:
          paths:
            - /harness/build/out.xml

# --- example 2 ---
              - step:
                  type: Run
                  ...
                  spec:
                    shell: Sh
                    command: |-
                     test --tests
                    ...
                    reports:
                      type: JUnit
                      spec:
                        paths:
                          - "/harness/results.xml"
                      type: JUnit

# --- example 3 ---
              - step:
                  type: Test
                  name: Intelligent Tests
                  identifier: test
                  spec:
                    command: test --tests
                    shell: Sh
                    ...
                    reports:
                      - "/harness/results.xml"

# --- example 4 ---
- step:
    type: Run
    identifier: test
    name: Test
    spec:
      shell: Sh
      command: |-
        mkdir -p /harness/phpunit
        phpunit --log-junit /harness/phpunit/junit.xml tests
      reports:
        type: JUnit
        spec:
          paths:
            - /harness/phpunit/junit.xml

# --- example 5 ---
- step:
    type: Run
    identifier: test
    name: Test
    spec:
      shell: Sh
      command: |-
        . venv/bin/activate
        mkdir /harness/test-results
        pytest --junitxml=harness/test-results/junit.xml
      reports:
        type: JUnit
        spec:
          paths:
            - /harness/test-results/junit.xml

# --- example 6 ---
              - step:
                  type: Test
                  name: Intelligent Tests
                  identifier: test
                  spec:
                    command: |-
                      python3 -m venv .venv
                      . .venv/bin/activate

                      python3 -m pip install -r requirements/test.txt
                      python3 -m pip install -e .

                      pytest --junitxml=out_report.xml
                    shell: Python
                    ...
                    reports:
                      - out_report.xml*

# --- example 7 ---
- step:
    type: Run
    identifier: test
    name: Test
    spec:
      shell: Sh
      command: |-
        bundle check || bundle install
        mkdir -p /harness/cucumber
        bundle exec cucumber --format junit --out /harness/cucumber/junit.xml
      reports:
        type: JUnit
        spec:
          paths:
            - /harness/cucumber/junit.xml

# --- example 8 ---
- step:
    type: Run
    identifier: test
    name: Test
    spec:
      shell: Powershell
      command: |-
        cd dotnet-agent/TestProject1
        wget -UseBasicParsing https://dot.net/v1/dotnet-install.ps1 -o dotnet-install.ps1
        .\dotnet-install.ps1
        dotnet build

        wget https://raw.githubusercontent.com/nunit/nunit-transforms/master/nunit3-junit/nunit3-junit.xslt -o nunit3-junit.xslt

        "C:/Program Files (x86)/NUnit.org/nunit-console/nunit3-console.exe" dotnet-agent/TestProject1/bin/Debug/net48/TestProject1.dll --result="UnitTestResults.xml;transform=nunit3-junit.xslt"
      reports:
        type: JUnit
        spec:
          paths:
            - UnitTestResults.xml

# --- example 9 ---
- step:
    type: Run
    identifier: test
    name: Test
    spec:
      shell: Sh
      command: |-
        go install github.com/jstemmer/go-junit-report/v2@latest
        go test -v ./... | tee report.out
        cat report.out | $HOME/go/bin/go-junit-report -set-exit-code > report.xml
      reports:
        type: JUnit
        spec:
          paths:
            - report.xml

# --- example 10 ---
              - step:
                  type: Run
                  ...
                  spec:
                    shell: Sh
                    command: |-
                     test -Dmaven.test.failure.ignore=true -DfailIfNoTests=false
                    ...
                    reports:
                      type: JUnit
                      spec:
                        paths:
                          - "target/surefire-reports/*.xml"
                      type: JUnit

# --- example 11 ---
              - step:
                  type: Test
                  name: Intelligent Tests
                  identifier: test
                  spec:
                    command: test -Dmaven.test.failure.ignore=true -DfailIfNoTests=false
                    shell: Sh
                    ...
                    reports:
                      - "target/surefire-reports/*.xml"

# --- example 12 ---
- step:
    type: Run
    name: Run ESLint Tests
    identifier: run_eslint_tests
    spec:
      shell: Sh
      command: |
        mkdir -p /harness/reports
        eslint ./src/ --format junit --output-file /harness/reports/eslint.xml
    reports:
      type: JUnit
      spec:
        paths:
          - "/harness/reports/eslint.xml"

# --- example 13 ---
- step:
    type: Run
    name: Run Jest Tests
    identifier: run_jest_tests
    spec:
      shell: Sh
      command: |
        yarn add --dev jest-junit
        jest --ci --runInBand --reporters=default --reporters=jest-junit
    envVariables:
      JEST_JUNIT_OUTPUT_DIR: "/harness/reports"
    reports:
      type: JUnit
      spec:
        paths:
          - "/harness/reports/*.xml"

# --- example 14 ---
- step:
    type: Run
    name: Run Karma Tests
    identifier: run_karma_tests
    spec:
      shell: Sh
      command: |
        npm install
        mkdir /harness/junit
        karma start ./karma.conf.js
    envVariables:
      JUNIT_REPORT_PATH: /harness/junit/
      JUNIT_REPORT_NAME: test-results.xml
    reports:
      type: JUnit
      spec:
        paths:
          - "/harness/junit/test-results.xml"

# --- example 15 ---
- step:
    type: Run
    name: Run Mocha Tests
    identifier: run_mocha_tests
    spec:
      shell: Sh
      command: |
        npm install
        mkdir /harness/junit
        mocha test --reporter mocha-junit-reporter --reporter-options mochaFile=./path_to_your/file.xml
    reports:
      type: JUnit
      spec:
        paths:
          - "/harness/junit/test-results.xml"

# --- example 16 ---
- step:
    type: Run
    name: Run Ruby Tests
    identifier: run_ruby_tests
    spec:
      shell: Sh
      command: |
        bundle check || bundle install
        bundle exec rake test --junit
    reports:
      type: JUnit
      spec:
        paths:
          - "/harness/report.xml"

# --- example 17 ---
- step:
    type: Run
    name: Run RSpec Tests
    identifier: run_rspec_tests
    spec:
      shell: Sh
      command: |
        bundle check --path=vendor/bundle || bundle install --path=vendor/bundle --jobs=4 --retry=3
        mkdir /harness/rspec
        bundle exec rspec --format progress --format RspecJunitFormatter -o /harness/rspec/rspec.xml
    reports:
      type: JUnit
      spec:
        paths:
          - "/harness/rspec/rspec.xml"
