# source: docs/continuous-delivery/deploy-srv-diff-platforms/kubernetes/cd-k8s-ref/kubernetes-rollout-restart.md  (https://developer.harness.io/docs/continuous-delivery/deploy-srv-diff-platforms/kubernetes/cd-k8s-ref/kubernetes-rollout-restart)

# --- example 1 ---
- step:
    type: K8sRollout
    name: K8sRollout_Restart_ManifestPath_RuntimInput
    identifier: K8sRollout_Restart_ManifestPath_RuntimInput
    spec:
      command: restart
      resources:
        type: ManifestPath
        spec:
          manifestPaths: <+input>
    timeout: 10m

