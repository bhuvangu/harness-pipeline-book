# source: docs/platform/delegates/manage-delegates/run-all-pipeline-steps-in-one-pod.md  (https://developer.harness.io/docs/platform/delegates/manage-delegates/run-all-pipeline-steps-in-one-pod)

# --- example 1 ---
   pipeline:
   name: test
   identifier: test
   projectIdentifier: harness-test
   orgIdentifier: default
   tags: {}
   stages:
    - stage:
        name: shell
        identifier: shell
        description: ""
        type: Custom
        spec:
          execution:
            steps:
              - step:
                  type: ShellScript
                  name: select_delegate
                  identifier: select_delegate
                  spec:
                    shell: Bash
                    onDelegate: true
                    source:
                      type: Inline
                      spec:
                        script: |
                          echo $HOSTNAME
                          HOST_SELECTOR=$HOSTNAME
                    environmentVariables: []
                    outputVariables:
                      - name: HOST_SELECTOR
                        type: String
                        value: HOST_SELECTOR
                  timeout: 10m
              - step:
                  type: ShellScript
                  name: use delegate
                  identifier: use_delegate
                  spec:
                    shell: Bash
                    onDelegate: true
                    source:
                      type: Inline
                      spec:
                        script: echo <+execution.steps.select_delegate.output.outputVariables.HOST_SELECTOR>
                    environmentVariables: []
                    outputVariables: []
                    delegateSelectors:
                      - <+execution.steps.select_delegate.output.outputVariables.HOST_SELECTOR>
                  timeout: 10m
                  failureStrategies: []
        tags: {}
