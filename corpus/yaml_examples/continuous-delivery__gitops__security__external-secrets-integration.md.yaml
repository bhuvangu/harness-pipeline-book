# source: docs/continuous-delivery/gitops/security/external-secrets-integration.md  (https://developer.harness.io/docs/continuous-delivery/gitops/security/external-secrets-integration)

# --- example 1 ---
   apiVersion: argoproj.io/v1alpha1
   kind: Application
   metadata:
     name: external-secrets
     namespace: argocd
   spec:
     project: default
     source:
       repoURL: 'https://external-secrets.github.io/external-secrets/'
       chart: external-secrets
       targetRevision: &lt;chart-version>
     destination:
       server: 'https://kubernetes.default.svc'
       namespace: external-secrets
     syncPolicy:
       automated:
         selfHeal: true
         prune: true

# --- example 2 ---
   apiVersion: external-secrets.io/v1beta1
   kind: ClusterSecretStore
   metadata:
     name: global-secret-store
   spec:
     provider:
       aws:
         service: SecretsManager
         region: your-region
         auth:
           secretRef:
             accessKeyIDSecretRef:
               name: awssm-secret
               key: access-key
               namespace: default
             secretAccessKeySecretRef:
               name: awssm-secret
               key: secret-access-key
               namespace: default

# --- example 3 ---
   apiVersion: external-secrets.io/v1beta1
   kind: ExternalSecret
   metadata:
     name: app-secret
   spec:
     refreshInterval: 1m
     secretStoreRef:
       name: global-secret-store
       kind: ClusterSecretStore
     target:
       name: app-secret
       creationPolicy: Owner
     dataFrom:
     - extract:
         key: app-secret
