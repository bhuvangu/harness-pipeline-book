# source: docs/platform/delegates/secure-delegates/delegate-read-only-file-system-config-guide.md  (https://developer.harness.io/docs/platform/delegates/secure-delegates/delegate-read-only-file-system-config-guide)

# --- example 1 ---
    apiVersion: apps/v1
    kind: Deployment
    metadata:
    labels:
        harness.io/name: k8s-ro
    name: k8s-ro
    namespace: harness-delegate-ng
    spec:
    replicas: 1
    minReadySeconds: 120
    selector:
        matchLabels:
        harness.io/name: k8s-ro
    template:
        metadata:
        labels:
            harness.io/name: k8s-ro
        annotations:
            prometheus.io/scrape: "true"
            prometheus.io/port: "3460"
            prometheus.io/path: "/api/metrics"
        spec:
        terminationGracePeriodSeconds: 600
        restartPolicy: Always
        containers:
        - image: harness/delegate:24.08.83702.minimal
            imagePullPolicy: Always
            name: delegate
            securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1001
            ports:
            - containerPort: 8080
            resources:
            limits:
                memory: "2048Mi"
            requests:
                cpu: "0.5"
                memory: "2048Mi"
            livenessProbe:
            httpGet:
                path: /api/health
                port: 3460
                scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
            startupProbe:
            httpGet:
                path: /api/health
                port: 3460
                scheme: HTTP
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 15
            envFrom:
            - secretRef:
                name: k8s-ro-account-token
            env:
            - name: WORKING_DIR
            value: "/opt/harness-delegate/writable/"
            - name: JAVA_OPTS
            value: "-Xms64M"
            - name: ACCOUNT_ID
            value: <account_id>
            - name: MANAGER_HOST_AND_PORT
            value: https://app.harness.io
            - name: DELEGATE_NAME
            value: k8s-ro
            - name: DELEGATE_TYPE
            value: "KUBERNETES"
            - name: DELEGATE_NAMESPACE
            valueFrom:
                fieldRef:
                fieldPath: metadata.namespace
            - name: INIT_SCRIPT
            value: ""
            - name: DELEGATE_DESCRIPTION
            value: ""
            - name: DELEGATE_TAGS
            value: ""
            - name: NEXT_GEN
            value: "true"
            volumeMounts:
            - name: work-dir
            mountPath: /opt/harness-delegate/writable/
            - name: tmp-dir
            mountPath: /tmp
        volumes:
        - name: work-dir
          emptyDir: {}
        - name: tmp-dir
          emptyDir:
            medium: "Memory"

# --- example 2 ---
    securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 1001

# --- example 3 ---
    volumeMounts:
    - name: work-dir
    mountPath: /opt/harness-delegate/writable/
    - name: tmp-dir
    mountPath: /tmp
    volumes:
    - name: work-dir
    emptyDir: {}
    - name: tmp-dir
    emptyDir:
        medium: "Memory"
