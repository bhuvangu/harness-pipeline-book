# source: docs/platform/connectors/cloud-providers/ref-cloud-providers/aws-connector-settings-reference.md  (https://developer.harness.io/docs/platform/connectors/cloud-providers/ref-cloud-providers/aws-connector-settings-reference)

# --- example 1 ---
connector:
  name: aws-irsa-cross-account
  type: Aws
  spec:
    credential:
      type: Irsa
      crossAccountAccess:
        crossAccountRoleArn: arn:aws:iam::ACCOUNT_B:role/target-role
      region: us-east-1
    delegateSelectors:
      - eks-delegate

# --- example 2 ---
connector:
  name: aws-test-oidc
  identifier: testoidc
  type: Aws
  spec:
    credential:
      type: OidcAuthentication
      spec:
        iamRoleArn: arn:aws:iam::806630305776:role/test-automation
        oidcSessionTagKeys:
          - environment_id
          - environment_type
          - connector_name
          - delegate_selectors
    region: us-east-1
    delegateSelectors:
      - aws
    executeOnDelegate: true

# --- example 3 ---
connector:
  name: aws-sm-oidc
  identifier: awssmoidc
  type: AwsSecretManager
  spec:
    credential:
      type: OidcAuthentication
      spec:
        iamRoleArn: arn:aws:iam::806630305776:role/test-automation
        oidcSessionTagKeys:
          - account_id
          - delegate_selectors
          - triggered_by_name
          - pipeline_id
    region: us-east-1
    delegateSelectors:
      - aws
    executeOnDelegate: true

# --- example 4 ---
connector:
  name: aws-kms-oidc
  identifier: testkms2
  type: AwsKms
  spec:
    credential:
      type: OidcAuthentication
      spec:
        iamRoleArn: arn:aws:iam::806630305776:role/test-automation
        oidcSessionTagKeys:
          - account_id
          - delegate_selectors
          - pipeline_id
          - connector_id
    kmsArnInPlainText: arn:aws:kms:us-east-1:806630305776:key/019d3436-6083-42a2-81cf-cfbd678742d6
    region: us-east-1
    delegateSelectors:
      - aws
    executeOnDelegate: true

