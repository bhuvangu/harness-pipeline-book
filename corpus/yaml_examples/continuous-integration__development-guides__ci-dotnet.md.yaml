# --- example 13 ---
- step:
    type: Run
    name: Install dotnet
    identifier: install_dotnet
    spec:
      shell: Sh
      command: |-
        curl -fsSL https://dot.net/v1/dotnet-install.sh | bash -s -- --channel 8.0
        export DOTNET_WORKSPACE=$HOME/.dotnet
        export PATH=$DOTNET_WORKSPACE:$PATH
        dotnet --info

