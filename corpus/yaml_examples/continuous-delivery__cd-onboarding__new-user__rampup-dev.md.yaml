# source: docs/continuous-delivery/cd-onboarding/new-user/rampup-dev.md  (https://developer.harness.io/docs/continuous-delivery/cd-onboarding/new-user/rampup-dev)

# --- example 1 ---
projectIdentifier: default
orgIdentifier: default
tags: {}
stages:
  - stage:
      name: deployKubernetes
      identifier: Deploy_Kubernetes
      description: Golden Kubernetes Deployment Stage
      type: Deployment
      spec:
        deploymentType: Kubernetes
        execution:
          steps:
            - step:
                type: K8sDryRun
                name: Dry Run
                identifier: Dry_Run
                spec: {}
                timeout: 10m
            - step:
                type: HarnessApproval
                name: Approval
                identifier: Approval
                spec:
                  approvalMessage: Please review the following information and approve the pipeline progression
                  includePipelineExecutionHistory: true
                  isAutoRejectEnabled: false
                  approvers:
                    userGroups:
                      - account._account_all_users
                    minimumCount: 1
                    disallowPipelineExecutor: false
                  approverInputs: []
                timeout: 1d
            - step:
                type: K8sRollingDeploy
                name: Rolling Deployment
                identifier: RRolling_Deployment
                spec:
                  skipDryRun: <+input>
                  pruningEnabled: false
                timeout: 10m
            - step:
                type: K8sDelete
                name: Cleanup
                identifier: Cleanup
                spec:
                  deleteResources:
                    type: ReleaseName
                    spec:
                      deleteNamespace: false
                timeout: 10m
          rollbackSteps:
            - step:
                name: Rollback Rollout Deployment
                identifier: rollbackRolloutDeployment
                type: K8sRollingRollback
                timeout: 10m
                spec:
                  pruningEnabled: false
        services:
          values: <+input>
          metadata:
            parallel: false
        environments:
          metadata:
            parallel: true
          values: <+input>
      tags: {}
      failureStrategies:
        - onFailure:
            errors:
              - AllErrors
            action:
              type: StageRollback
        - onFailure:
            errors:
              - AllErrors
            action:
              type: StageRollback
      when:
        pipelineStatus: Success
allowStageExecutions: true
